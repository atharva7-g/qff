[project]
name = "oasis"
version = "0.1.0"
description = "Isogenies on Oasis: quantum search for isogeny-walk passwords (Qiskit)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "qiskit==2.6.1",
    "qiskit-aer==0.18.2",
    "qiskit-algorithms==0.4.0",
]

[project.scripts]
oasis = "oasis.main:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
